server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Operation page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy service (cache proxy + its admin endpoints)
    location /api/proxy/ {
        proxy_pass http://proxy:8000/;
        proxy_http_version 1.1;
        # Do not let nginx buffer long-poll style waits; the proxy handles
        # single-flight waiting internally.
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }

    # Origin admin endpoints (edit / delay / 503 controls for testing)
    location /api/origin/ {
        proxy_pass http://origin:8080/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }
}
